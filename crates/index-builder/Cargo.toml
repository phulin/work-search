[package]
name = "work-search-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
crc32fast = "1.5"
libdeflater = "1"
unicode-normalization = "=0.1.25"

[dev-dependencies]
tempfile = "3"
